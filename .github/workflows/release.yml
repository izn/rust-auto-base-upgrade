name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package
        run: zip -q AutoBaseUpgrade.cszip AutoBaseUpgrade*.cs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" AutoBaseUpgrade.cszip --title "$GITHUB_REF_NAME" --generate-notes
